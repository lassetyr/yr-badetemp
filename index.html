<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Badetemperatur — Dulpen</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="title">
        <h1>Dulpen</h1>
        <p class="subtitle">Badeplass • Holmestrand</p>
      </div>
      <div class="current">
        <span class="temp" id="current-temp">–</span>
        <span class="trend" id="current-trend" hidden></span>
        <span class="as-of" id="current-asof"></span>
      </div>
    </header>

    <nav class="ranges" id="ranges">
      <button data-range="24h">24t</button>
      <button data-range="7d">7d</button>
      <button data-range="30d" class="active">30d</button>
      <button data-range="all">Alle</button>
    </nav>

    <main>
      <div id="chart" class="chart"></div>
      <p class="empty" id="empty" hidden>
        Ingen målinger registrert ennå. Kom tilbake etter den første målingen.
      </p>
      <p class="stats" id="stats" hidden></p>
    </main>

    <footer class="credits">
      Badetemperaturer levert av Yr · Værdata fra MET Norway
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
