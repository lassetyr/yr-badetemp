name: Poll water temperature

on:
  schedule:
    # Offset off :00/:20/:40 — those minutes are the most congested on
    # GitHub's shared scheduler and scheduled runs there get dropped most often.
    - cron: "7,27,47 * * * *" # every 20 minutes, off-peak (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Fetch and append reading
        run: node scripts/poll.js
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/dulpen.ndjson)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/dulpen.ndjson
            git commit -m "data: add reading $(date -u +%FT%TZ)"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
