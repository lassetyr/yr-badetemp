name: Poll water temperature

on:
  # No `schedule:` cron by design. GitHub's shared scheduler is unreliable for
  # sub-hourly runs, and a second trigger would double-bill Actions minutes, so
  # the poll is driven solely by an external scheduler (cron-job.org) hitting the
  # workflow_dispatch REST endpoint — see scripts/trigger.sh.
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Fetch and insert reading
        env:
          YR_API_KEY: ${{ secrets.YR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/poll.js
